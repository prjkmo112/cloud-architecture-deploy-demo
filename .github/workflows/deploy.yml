name: Deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.jpg'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew bootJar

      # cd 에서 업로드할 jar 파일 여기서 만들어놓음
      - name: Upload Jar artifact
        uses: actions/upload-artifact@v6
        with:
          name: 'app-jar'
          path: 'build/libs/app.jar'

  cd:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download JAR artifact       # ← ci job에서 빌드한 JAR 다운로드
        uses: actions/download-artifact@v6
        with:
          name: app-jar
          path: build/libs/

      # AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Docker hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 8: Docker 빌드 및 push
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}
          DOCKERHUB_URI=${{ secrets.DOCKERHUB_USERNAME }}/cloud-architecture-deploy-demo

          # Docker 빌드
          docker build --platform linux/arm64 -t $ECR_URI:$SHORT_SHA .
          
          # ECR push
          docker push $ECR_URI:$SHORT_SHA
          
          # 결과 출력
          echo "✅ Pushed: $ECR_URI:$SHORT_SHA"